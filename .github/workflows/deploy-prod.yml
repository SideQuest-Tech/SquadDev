name: Deploy to Production

on:
  push:
    branches: [new-design-ideation]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          VITE_ADMIN_SECRET: ${{ secrets.VITE_ADMIN_SECRET }}
          VITE_MEETINGS_TASK_ID: ${{ secrets.VITE_MEETINGS_TASK_ID }}
          VITE_SHOW_PORTFOLIO: ${{ secrets.VITE_SHOW_PORTFOLIO }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npx playwright test

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name sidequest-tech --branch main
